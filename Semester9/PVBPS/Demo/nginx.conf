# nginx.conf
worker_processes 1;
error_log /dev/stderr info;

events { worker_connections 1024; }

http {
    access_log off;

    server {
        listen 443 ssl;
        http2 on;
        
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        keepalive_requests 1000000;
        keepalive_timeout 60s;

        location / {
            return 200 "OK\n";
        }
    }
}
